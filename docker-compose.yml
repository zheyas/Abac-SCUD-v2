services:
  db:
    image: postgres:16-alpine
    container_name: abac_scud_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abac_scud}
      POSTGRES_USER: ${POSTGRES_USER:-abac_scud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abac_scud}
    volumes:
      - abac_scud_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # доступ к БД с хоста: localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: abac_scud_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-abac_scud}
      POSTGRES_USER: ${POSTGRES_USER:-abac_scud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abac_scud}
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  abac_scud_pgdata:
