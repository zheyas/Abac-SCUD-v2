# Render Blueprint: New → Blueprint → выбрать этот репозиторий
databases:
  - name: abac-scud-db
    plan: free
    databaseName: abac_scud
    user: abac_scud

services:
  - type: web
    name: abac-scud
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abac-scud-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: TIME_ZONE
        value: Asia/Yekaterinburg
      - key: WEB_CONCURRENCY
        value: "2"
